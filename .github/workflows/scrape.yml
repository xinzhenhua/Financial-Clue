name: Scrape Company Clues

on:
  workflow_dispatch:
    inputs:
      company_name:
        description: "公司全称（留空则读 companies.txt）"
        required: false
        default: ""
  schedule:
    - cron: "30 1 * * *"   # 每天北京时间 09:30

permissions:
  contents: write

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run scraper
        env:
          TARGET_COMPANY: ${{ github.event.inputs.company_name }}
          TYC_TOKEN: ${{ secrets.TYC_TOKEN }}
        run: python scraper.py
      - name: Commit results
        run: |
          git config user.name "clue-bot"
          git config user.email "clue-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "update clues"
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 3
          done
          exit 1
